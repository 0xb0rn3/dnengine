[package]
name = "dnengine"
version = "0.1.0"
edition = "2021"
description = "A download engine that uses every connection you have: many connections, every network interface, every mirror, resumable and verified"
license = "MIT"
repository = "https://github.com/0xb0rn3/dnengine"

# Zero Cargo dependencies. HTTP/TLS uses system libcurl through native/curl.c.
# A C compiler, ar and libcurl development headers are required to build.
# rlib for Rust callers, cdylib for C/Python/Go through the C ABI, staticlib for anything that
# wants to bake it in. One engine, every language.
[lib]
name = "dnengine"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib", "staticlib"]

[[bin]]
name = "dn"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
